<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>משימות הלימודים שלי</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --bg2: #181c27;
    --bg3: #1e2233;
    --surface: #242840;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --text: #eef0f8;
    --text2: #8b91b0;
    --text3: #555d7a;
    --green: #2ecc8f;
    --green2: #1a7a55;
    --green-bg: rgba(46,204,143,0.12);
    --red: #e05c5c;
    --red-bg: rgba(224,92,92,0.12);
    --amber: #f0a020;
    --amber-bg: rgba(240,160,32,0.12);
    --blue: #5b9cf6;
    --blue-bg: rgba(91,156,246,0.12);
    --purple: #a47cf5;
    --purple-bg: rgba(164,124,245,0.12);
    --teal: #3ec6c6;
    --teal-bg: rgba(62,198,198,0.12);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Heebo', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    direction: rtl;
  }
  .bg-blobs {
    position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0;
  }
  .blob {
    position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.15;
  }
  .blob1 { width: 500px; height: 500px; background: #2ecc8f; top: -150px; right: -100px; }
  .blob2 { width: 400px; height: 400px; background: #5b9cf6; bottom: -100px; left: -100px; }
  .blob3 { width: 300px; height: 300px; background: #a47cf5; top: 50%; left: 50%; transform: translate(-50%,-50%); }

  .app { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }

  header { text-align: center; margin-bottom: 2.5rem; }
  header .emoji { font-size: 48px; display: block; margin-bottom: 12px; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  header h1 { font-size: 32px; font-weight: 900; letter-spacing: -0.5px; background: linear-gradient(135deg, var(--green), var(--blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  header p { color: var(--text2); font-size: 15px; margin-top: 6px; }

  .progress-section { background: var(--bg2); border: 1px solid var(--border); border-radius: 20px; padding: 1.25rem 1.5rem; margin-bottom: 1.5rem; }
  .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .progress-header span { font-size: 14px; color: var(--text2); }
  .progress-header strong { font-size: 28px; font-weight: 700; color: var(--green); }
  .prog-track { background: var(--bg3); border-radius: 99px; height: 10px; overflow: hidden; }
  .prog-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--green2), var(--green)); transition: width 0.5s cubic-bezier(.4,0,.2,1); }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 14px; }
  .stat { background: var(--bg3); border-radius: 12px; padding: 10px; text-align: center; }
  .stat-num { font-size: 20px; font-weight: 700; }
  .stat-lbl { font-size: 11px; color: var(--text3); margin-top: 2px; }

  .motiv-banner {
    border-radius: 16px; padding: 12px 16px; margin-bottom: 1.5rem;
    display: flex; align-items: center; gap: 12px;
    background: var(--green-bg); border: 1px solid rgba(46,204,143,0.2);
    transition: all 0.4s;
  }
  .motiv-banner .icon { font-size: 24px; flex-shrink: 0; }
  .motiv-banner .txt { font-size: 14px; font-weight: 500; color: var(--green); }

  .add-box { background: var(--bg2); border: 1px solid var(--border2); border-radius: 20px; padding: 1.25rem 1.5rem; margin-bottom: 1.5rem; }
  .add-box h2 { font-size: 14px; font-weight: 500; color: var(--text2); margin-bottom: 12px; }
  .add-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .add-row input[type=text] {
    flex: 1; min-width: 200px;
    background: var(--bg3); border: 1px solid var(--border2); border-radius: 12px;
    color: var(--text); font-family: 'Heebo', sans-serif; font-size: 14px;
    padding: 10px 14px; outline: none; transition: border 0.2s;
  }
  .add-row input[type=text]:focus { border-color: var(--green); }
  .add-row input::placeholder { color: var(--text3); }
  .add-row select {
    background: var(--bg3); border: 1px solid var(--border2); border-radius: 12px;
    color: var(--text); font-family: 'Heebo', sans-serif; font-size: 13px;
    padding: 10px 12px; outline: none; cursor: pointer;
  }
  .btn-add {
    background: linear-gradient(135deg, var(--green2), var(--green));
    color: #fff; border: none; border-radius: 12px; padding: 10px 20px;
    font-family: 'Heebo', sans-serif; font-size: 14px; font-weight: 700;
    cursor: pointer; transition: opacity 0.15s, transform 0.1s; white-space: nowrap;
  }
  .btn-add:hover { opacity: 0.88; }
  .btn-add:active { transform: scale(0.97); }

  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1.25rem; }
  .tab {
    padding: 7px 16px; border-radius: 99px; font-size: 13px; font-weight: 500;
    cursor: pointer; border: 1px solid var(--border); background: var(--bg2);
    color: var(--text2); transition: all 0.15s; font-family: 'Heebo', sans-serif;
  }
  .tab:hover { border-color: var(--border2); color: var(--text); }
  .tab.active { background: var(--green-bg); border-color: var(--green); color: var(--green); }
  .tab.urgent-tab.active { background: var(--red-bg); border-color: var(--red); color: var(--red); }

  .task-list { display: flex; flex-direction: column; gap: 8px; }
  .task-card {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 16px;
    padding: 14px 16px; display: flex; align-items: center; gap: 12px;
    transition: border-color 0.2s, transform 0.15s, opacity 0.3s;
    animation: slideIn 0.25s ease;
  }
  @keyframes slideIn { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:none; } }
  .task-card:hover { border-color: var(--border2); transform: translateX(-2px); }
  .task-card.urgent-card { border-color: rgba(224,92,92,0.35); }
  .task-card.done { opacity: 0.45; }
  .task-card.done .task-title { text-decoration: line-through; color: var(--text3); }

  .chk {
    width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid var(--border2);
    cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; background: transparent;
  }
  .chk:hover { border-color: var(--green); }
  .chk.checked { background: var(--green); border-color: var(--green); }
  .chk svg { display: none; }
  .chk.checked svg { display: block; }

  .task-body { flex: 1; min-width: 0; }
  .task-title { font-size: 15px; color: var(--text); font-weight: 400; line-height: 1.4; }
  .task-meta { display: flex; align-items: center; gap: 6px; margin-top: 5px; flex-wrap: wrap; }
  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 500;
  }
  .b-exam    { background: var(--amber-bg); color: var(--amber); }
  .b-project { background: var(--blue-bg);  color: var(--blue);  }
  .b-hw      { background: var(--purple-bg); color: var(--purple); }
  .b-completion { background: var(--teal-bg); color: var(--teal); }
  .b-urgent  { background: var(--red-bg);   color: var(--red);   }

  .task-subject { font-size: 12px; color: var(--text3); }

  .btn-del {
    background: none; border: none; cursor: pointer; color: var(--text3);
    font-size: 18px; padding: 4px 6px; border-radius: 8px; transition: all 0.15s; line-height: 1;
    flex-shrink: 0;
  }
  .btn-del:hover { color: var(--red); background: var(--red-bg); }

  .empty { text-align: center; padding: 3rem 1rem; color: var(--text3); }
  .empty .e-icon { font-size: 48px; margin-bottom: 12px; }
  .empty p { font-size: 15px; }

  @media (max-width: 500px) {
    .stats { grid-template-columns: repeat(2,1fr); }
    .add-row { flex-direction: column; }
    header h1 { font-size: 24px; }
  }
</style>
</head>
<body>
<div class="bg-blobs">
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
</div>

<div class="app">
  <header>
    <span class="emoji">📚</span>
    <h1>משימות הלימודים שלי</h1>
    <p>תסיים אחת אחת — כל סימן ✓ מקרב אותך ליעד</p>
  </header>

  <div class="progress-section">
    <div class="progress-header">
      <span>התקדמות כללית</span>
      <strong id="pct-num">0%</strong>
    </div>
    <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
    <div class="stats">
      <div class="stat"><div class="stat-num" id="s-total">0</div><div class="stat-lbl">סה"כ</div></div>
      <div class="stat"><div class="stat-num" style="color:var(--green)" id="s-done">0</div><div class="stat-lbl">הושלמו ✓</div></div>
      <div class="stat"><div class="stat-num" style="color:var(--amber)" id="s-left">0</div><div class="stat-lbl">נותרו</div></div>
      <div class="stat"><div class="stat-num" style="color:var(--red)" id="s-urg">0</div><div class="stat-lbl">דחוף 🚨</div></div>
    </div>
  </div>

  <div class="motiv-banner" id="motiv">
    <span class="icon">🔥</span>
    <span class="txt" id="motiv-txt">קדימה! הוסף את המשימה הראשונה שלך.</span>
  </div>

  <div class="add-box">
    <h2>+ הוספת משימה חדשה</h2>
    <div class="add-row">
      <input type="text" id="inp-title" placeholder="תיאור המשימה..." />
      <select id="inp-cat">
        <option value="exam">📝 מבחן</option>
        <option value="project">💻 פרויקט</option>
        <option value="hw" selected>📖 ש.ב</option>
        <option value="completion">📌 השלמה</option>
        <option value="urgent">🚨 הכי נחוץ</option>
      </select>
      <input type="text" id="inp-sub" placeholder="מקצוע (אופציונלי)" style="max-width:160px" />
      <button class="btn-add" onclick="addTask()">+ הוסף</button>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="task-list" id="task-list"></div>
</div>

<script>
const CATS = {
  exam:       { label: 'מבחן',    emoji: '📝', cls: 'b-exam' },
  project:    { label: 'פרויקט',  emoji: '💻', cls: 'b-project' },
  hw:         { label: 'ש.ב',    emoji: '📖', cls: 'b-hw' },
  completion: { label: 'השלמה',  emoji: '📌', cls: 'b-completion' },
  urgent:     { label: 'דחוף',   emoji: '🚨', cls: 'b-urgent' },
};

const MOTIVS = [
  ['🔥', 'קדימה! הוסף את המשימה הראשונה שלך.'],
  ['💪', 'כבר התחלת — ממשיכים, אתה על הדרך!'],
  ['⚡', 'מצוין! כבר בדרך הנכונה, לא עוצרים.'],
  ['🚀', 'יותר ממחצית — אתה חזק יותר ממה שחשבת!'],
  ['🏁', 'כמעט שם! עוד קצת ומסיימים הכל!'],
  ['🎉', 'מושלם! 100% — מגיע לך מנוחה אמיתית! 🎊'],
];

let tasks = [];
let activeTab = 'all';

try { tasks = JSON.parse(localStorage.getItem('st_tasks') || '[]'); } catch(e){}

function save() { try { localStorage.setItem('st_tasks', JSON.stringify(tasks)); } catch(e){} }

function addTask() {
  const title = document.getElementById('inp-title').value.trim();
  if (!title) { document.getElementById('inp-title').focus(); return; }
  const cat = document.getElementById('inp-cat').value;
  const sub = document.getElementById('inp-sub').value.trim();
  tasks.unshift({ id: Date.now(), title, cat, sub, done: false });
  save();
  document.getElementById('inp-title').value = '';
  document.getElementById('inp-sub').value = '';
  render();
}

function toggle(id) {
  const t = tasks.find(t => t.id === id);
  if (t) { t.done = !t.done; save(); render(); }
}

function del(id) {
  if (!confirm('למחוק את המשימה?')) return;
  tasks = tasks.filter(t => t.id !== id);
  save(); render();
}

function getFiltered() {
  if (activeTab === 'all') return tasks;
  if (activeTab === 'done') return tasks.filter(t => t.done);
  if (activeTab === 'todo') return tasks.filter(t => !t.done);
  return tasks.filter(t => t.cat === activeTab);
}

function render() {
  const total = tasks.length;
  const done  = tasks.filter(t => t.done).length;
  const left  = total - done;
  const urg   = tasks.filter(t => t.cat === 'urgent' && !t.done).length;
  const pct   = total ? Math.round(done / total * 100) : 0;

  document.getElementById('s-total').textContent = total;
  document.getElementById('s-done').textContent  = done;
  document.getElementById('s-left').textContent  = left;
  document.getElementById('s-urg').textContent   = urg;
  document.getElementById('pct-num').textContent = pct + '%';
  document.getElementById('prog-fill').style.width = pct + '%';

  const mi = pct === 100 ? 5 : pct >= 75 ? 4 : pct >= 50 ? 3 : pct >= 25 ? 2 : total > 0 ? 1 : 0;
  document.getElementById('motiv').querySelector('.icon').textContent = MOTIVS[mi][0];
  document.getElementById('motiv-txt').textContent = MOTIVS[mi][1];

  const tabDefs = [
    { key: 'all',        label: 'הכל' },
    { key: 'todo',       label: 'לביצוע' },
    { key: 'urgent',     label: '🚨 דחוף', cls: 'urgent-tab' },
    { key: 'exam',       label: '📝 מבחנים' },
    { key: 'project',    label: '💻 פרויקטים' },
    { key: 'hw',         label: '📖 ש.ב' },
    { key: 'completion', label: '📌 השלמות' },
    { key: 'done',       label: '✓ הושלם' },
  ];
  document.getElementById('tabs').innerHTML = tabDefs.map(t =>
    `<button class="tab${t.cls?' '+t.cls:''}${activeTab===t.key?' active':''}" onclick="setTab('${t.key}')">${t.label}</button>`
  ).join('');

  const filtered = getFiltered();
  const listEl = document.getElementById('task-list');

  if (!filtered.length) {
    listEl.innerHTML = `<div class="empty"><div class="e-icon">✨</div><p>אין משימות כאן — הוסף אחת למעלה!</p></div>`;
    return;
  }

  const sorted = [...filtered].sort((a, b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    if (a.cat === 'urgent' && b.cat !== 'urgent') return -1;
    if (b.cat === 'urgent' && a.cat !== 'urgent') return 1;
    return b.id - a.id;
  });

  listEl.innerHTML = sorted.map(t => {
    const c = CATS[t.cat];
    return `<div class="task-card${t.done?' done':''}${t.cat==='urgent'&&!t.done?' urgent-card':''}">
      <div class="chk${t.done?' checked':''}" onclick="toggle(${t.id})" title="סמן כהושלם">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
          <polyline points="2,6 5,9 10,3" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="task-body">
        <div class="task-title">${escHtml(t.title)}</div>
        <div class="task-meta">
          <span class="badge ${c.cls}">${c.emoji} ${c.label}</span>
          ${t.sub ? `<span class="task-subject">${escHtml(t.sub)}</span>` : ''}
        </div>
      </div>
      <button class="btn-del" onclick="del(${t.id})" title="מחק">✕</button>
    </div>`;
  }).join('');
}

function setTab(k) { activeTab = k; render(); }

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.getElementById('inp-title').addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });
render();
</script>
</body>
</html>
